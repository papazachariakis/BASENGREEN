# Basen Green 30kWh — Lovelace Dashboard Card
#
# Προσθήκη: Επεξεργασία πίνακα → Προσθήκη κάρτας → Manual → επικόλληση
#
# ΣΗΜΑΝΤΙΚΟ: Αν τα entity_id διαφέρουν, πήγαινε:
#   Ρυθμίσεις → Συσκευές → TP_BSTBD-25C-2 → entities
# και διόρθωσε το prefix παρακάτω (π.χ. tp_bstbd_25c_2)

type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 🔋 Basen Green 30kWh
      Tianpower BMS · TP_BSTBD-25C-2

  # --- Κύρια μετρήσεις ---
  - type: glance
    title: Κατάσταση μπαταρίας
    show_name: true
    show_icon: true
    entities:
      - entity: sensor.tp_bstbd_25c_2_state_of_charge
        name: SOC
      - entity: sensor.tp_bstbd_25c_2_total_voltage
        name: Τάση
      - entity: sensor.tp_bstbd_25c_2_current
        name: Ρεύμα
      - entity: sensor.tp_bstbd_25c_2_power
        name: Ισχύς
      - entity: sensor.tp_bstbd_25c_2_temperature
        name: Θερμ.

  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.tp_bstbd_25c_2_state_of_charge
        name: SOC
        min: 0
        max: 100
        severity:
          green: 60
          yellow: 30
          red: 0
        needle: true
      - type: gauge
        entity: sensor.tp_bstbd_25c_2_state_of_health
        name: SOH
        min: 0
        max: 100
        severity:
          green: 80
          yellow: 60
          red: 0
        needle: true

  - type: horizontal-stack
    cards:
      - type: entity
        entity: binary_sensor.tp_bstbd_25c_2_charging
        name: Φόρτιση
        icon: mdi:battery-charging
      - type: entity
        entity: binary_sensor.tp_bstbd_25c_2_discharging
        name: Εκφόρτιση
        icon: mdi:battery-arrow-down
      - type: entity
        entity: binary_sensor.tp_bstbd_25c_2_balancing
        name: Balancing
        icon: mdi:scale-balance

  # --- Τάσεις κελιών (πλέγμα 4x4) ---
